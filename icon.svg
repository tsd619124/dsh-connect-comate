<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Comate mark: a rounded vessel holding a code bracket pair, with a filled
    diamond where the two brackets would meet. The vessel says "assistant",
    the brackets say "code", and the diamond is the credit the turn spends.

    Stroke-only so the tile reads at 16px, and it inverts with the theme the
    way the sibling plugin icons do: near-black ink on light, near-white on dark.
  -->
  <style>
    .ink { stroke: #171717; }
    .fill { fill: #171717; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f2f2f2; }
      .fill { fill: #f2f2f2; }
    }
  </style>
  <rect class="ink" x="10" y="10" width="108" height="108" rx="30" stroke-width="9"/>
  <g class="ink" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 46 L34 64 L52 82"/>
    <path d="M76 46 L94 64 L76 82"/>
  </g>
  <path class="fill" d="M64 55 L73 64 L64 73 L55 64 Z"/>
</svg>
